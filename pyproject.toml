[tool.poetry]
name = "shakespearelang"
version = "1.0.0"
description = "An interpreter for the Shakespeare Programming Language."
authors = ["Zeb Burke-Conte <zebburkeconte@gmail.com>"]
readme = "README.rst"
repository = "http://github.com/zmbc/shakespearelang"
homepage = "http://shakespearelang.com"
license = "MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Topic :: Software Development :: Interpreters",
]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.5.0"
# TatSu 5.13+ changes the generated parser API and the format of parse errors,
# which _parser.py and the error formatting tests rely on. Keep 5.6.x until the
# parser is regenerated.
tatsu = "~5.6.1"

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.8.0"
mkdocstrings = { version = "^1.0.8", extras = ["python"] }
pytest = "^9.2.0"
tox = "^4.67.5"
coverage = "^7.17.0"
black = "^26.10.1"
snakeviz = "^2.2.2"
pexpect = "^4.9.0"
mkdocs-click = "^0.9.0"
mike = "^2.2.0"

[tool.poetry.scripts]
shakespeare = "shakespearelang.cli:main"

[build-system]
requires = ["poetry-core>=2.0.1"]
build-backend = "poetry.core.masonry.api"
